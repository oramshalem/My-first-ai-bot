name = "kids-robot-token"
main = "src/index.js"
compatibility_date = "2026-10-20"

# The character prompt and the test page are bundled into the Worker as text.
[[rules]]
type = "Text"
globs = ["**/*.txt", "**/*.html"]
fallthrough = true

# Settings that are not secret. API keys, DEVICE_KEYS and ADMIN_PASSWORD are set
# with `wrangler secret put` (or .dev.vars locally) and never live in this file.
[vars]
# Which provider /token uses: "gemini" or "openai".
PROVIDER = "gemini"
TOKEN_TTL_SECONDS = "120"

GEMINI_MODEL = "gemini-3.8-live"
GEMINI_VOICE = "Puck"
# Google's docs disagree on v1alpha vs v1beta for constrained tokens. If the
# token request fails with 404, try "v1beta".
GEMINI_API_VERSION = "v1alpha"
# Language hint for the transcript of what the child says (the model itself
# understands Hebrew either way). If Gemini closes the connection with 1007,
# set this to "" to let it auto-detect.
GEMINI_TRANSCRIBE_LANGUAGE = "he-IL"
# When always listening: how long a silence (ms) counts as "the child finished".
# Longer means fewer cut-ins mid-sentence but slower answers. "" uses Gemini's default.
GEMINI_SILENCE_MS = "700"

OPENAI_MODEL = "gpt-realtime-2.1-mini"
OPENAI_VOICE = "marin"
OPENAI_TRANSCRIBE_MODEL = "gpt-4o-mini-transcribe"

# Text-only conversation log. On the first `wrangler deploy` the database is
# created automatically; tables are created by the Worker on first use.
[[d1_databases]]
binding = "DB"
database_name = "kids-robot-logs"
